// noinspection GradleCompatible
repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'

android {
    compileSdk = 37

    defaultConfig {
        applicationId "cz.jmakovicka.financisto"
        minSdkVersion 29
        targetSdkVersion 37
        versionCode 16
        versionName "2.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()
                ]
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }


    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }

    sourceSets {
        test {
            resources.srcDirs += ['src/test/resources']
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES', 'META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/dependencies.txt', 'META-INF/LGPL2.1']
        }
    }
    namespace 'ru.orangesoftware.financisto'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    buildFeatures {
        buildConfig true
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okio:okio:3.17.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.github.bumptech.glide:glide:5.0.7'

//    implementation 'com.google.android.gms:play-services-auth:20.7.0'
//    implementation 'com.google.http-client:google-http-client-gson:1.43.3'
//    implementation 'com.google.api-client:google-api-client-android:2.2.0'
//    implementation 'com.google.apis:google-api-services-drive:v3-rev136-1.25.0'
//    implementation 'com.google.guava:guava:32.1.3-android'

    implementation fileTree(include: '**/*.jar', dir: 'libs')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
